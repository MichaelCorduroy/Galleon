<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
  </head>
  <body>
	  <h1>Galleon</h1>
	  <div id="songs"></div>

	  <script>
		  fetch("http://localhost:3000/songs")
			  .then(r => r.json())
			  .then(songs => {
				  document.getElementById("songs").innerHTML = 
					  songs.map(song => `
						  <div>
						  ${song.title} - ${song.artist}
						  <audio controls src="http://localhost:3000/stream/${song.id}"></audio>
						  </div>
					  `).join("");
			  });
	  </script>
    <div id="root"></div>
  </body>
</html>
